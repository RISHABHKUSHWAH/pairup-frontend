<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F8FC" />
    </linearGradient>

    <!-- Node 1: Solid Primary Deep Blue -->
    <linearGradient id="primaryBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Node 2: Cyan / Sky Blue Stroke -->
    <linearGradient id="skyBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow for Cards -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F2A4A" flood-opacity="0.08" />
    </filter>

    <!-- Central Packet Glow -->
    <filter id="packetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="800" height="480" fill="url(#bgCanvas)" rx="28" />

  <!-- ================= LOGO ICON / MARK ================= -->
  <g id="icon-mark" transform="translate(0, -10)">
    
    <!-- Connection Bridge (Blue Tinted Dashed Line) -->
    <line x1="270" y1="200" x2="530" y2="200" 
          stroke="#BFDBFE" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-dasharray="10 14" />

    <!-- Active Data Transmission Node (Cyan/Sky Blue) -->
    <circle cx="400" cy="200" r="13" fill="#0EA5E9" filter="url(#packetGlow)" />
    <circle cx="400" cy="200" r="4.5" fill="#FFFFFF" opacity="0.95" />

    <!-- Left Node: Solid Primary Blue Squircle (Host / Mentor) -->
    <g filter="url(#cardShadow)">
      <rect x="150" y="130" width="140" height="140" rx="42" fill="url(#primaryBlueGrad)" />
      <!-- Central Focus Core -->
      <circle cx="220" cy="200" r="18" fill="#FFFFFF" />
    </g>

    <!-- Right Node: Outlined Sky Blue Squircle (Guest / Mentee) -->
    <g filter="url(#cardShadow)">
      <rect x="510" y="130" width="140" height="140" rx="42" fill="#FFFFFF" stroke="url(#skyBlueGrad)" stroke-width="9" />
      <!-- Central Focus Core -->
      <circle cx="580" cy="200" r="18" fill="url(#skyBlueGrad)" />
    </g>
  </g>
</svg>
